# Snippet Nginx para publicar Reflex bajo el subpath /IA_videos/
# Requiere soporte de WebSockets para el canal de eventos /_event de Reflex.

location /IA_videos/ {
    proxy_pass http://127.0.0.1:8503/IA_videos/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Enrutamiento del WebSocket y API de estado de Reflex hacia el backend (8504)
location /IA_videos/_event {
    proxy_pass http://127.0.0.1:8504/_event;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

location /IA_videos/_upload {
    client_max_body_size 500M;
    proxy_pass http://127.0.0.1:8504/_upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /IA_videos/ping {
    proxy_pass http://127.0.0.1:8504/ping;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
